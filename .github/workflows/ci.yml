name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-minimum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up minimum Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify minimum Python contract
        run: |
          python -m unittest tests.test_makefile_python_runtime
          make validate PYTHON=python
          make selftest PYTHON=python

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate scripts and generated agent contracts
        run: |
          make validate

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate gateway-core plugin build and tests
        run: |
          npm --prefix plugin/gateway-core ci --no-audit --no-fund
          npm --prefix plugin/gateway-core run lint
          npm --prefix plugin/gateway-core run test

      - name: Validate V1 execution sidebar
        run: |
          npm --prefix plugin/gateway-sidebar ci --ignore-scripts --no-audit --no-fund
          npm --prefix plugin/gateway-sidebar test

      - name: Install pinned OpenCode resume-test runtime
        run: |
          npm install --global opencode-ai@1.18.18 --no-audit --no-fund

      - name: Gate provider-boundary session resume regressions
        run: |
          make gateway-resume-redaction-e2e-prebuilt OPENCODE_BIN="$(command -v opencode)"

      - name: Gate deterministic gateway workflows
        run: |
          node scripts/gateway_workflow_scenario_report.mjs --fail-below 100

      - name: Run deterministic self-tests
        run: |
          make selftest

      - name: Installer smoke test
        run: |
          TMP_HOME="$(mktemp -d)"
          HOME="$TMP_HOME" REPO_URL="$GITHUB_WORKSPACE" REPO_REF="$GITHUB_SHA" ./install.sh --self-check-profile core
          HOME="$TMP_HOME" python "$TMP_HOME/.config/opencode/my_opencode/scripts/mcp_command.py" status
          HOME="$TMP_HOME" python "$TMP_HOME/.config/opencode/my_opencode/scripts/plugin_command.py" profile lean
          HOME="$TMP_HOME" python "$TMP_HOME/.config/opencode/my_opencode/scripts/plugin_command.py" doctor --json

      - name: Installer full-profile smoke test
        run: |
          trap 'rm -f scripts/.install-test-ci-untracked.py' EXIT
          printf '%s\n' '# disposable snapshot fixture' > scripts/.install-test-ci-untracked.py
          make install-test-full PYTHON=python

  sidebar-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install pinned V2 runtime and terminal tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
          npm install --global @opencode/cli@2.2.6 --no-audit --no-fund
          npm ci --prefix plugin/gateway-sidebar-v2 --ignore-scripts --no-audit --no-fund
          npm ci --prefix plugin/gateway-core --ignore-scripts --no-audit --no-fund
          npm --prefix plugin/gateway-core run build

      - name: Validate V2 sidebar and live terminal behavior
        run: |
          npm --prefix plugin/gateway-sidebar-v2 run typecheck
          npm --prefix plugin/gateway-sidebar-v2 test
          npm --prefix plugin/gateway-sidebar-v2 run test:live -- --opencode-bin "$(command -v opencode)"
          python plugin/gateway-core/test/v2/execution_status_live_smoke.py --opencode-bin "$(command -v opencode)" --with-tui

  gateway-v2-permission:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        opencode: [2.2.5, 2.2.6]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned test runtime and build gateway
        run: |
          npm install --global "@opencode/cli@${{ matrix.opencode }}" --no-audit --no-fund
          opencode --version | grep -Fx "opencode v${{ matrix.opencode }}"
          npm ci --prefix plugin/gateway-core --ignore-scripts --no-audit --no-fund
          npm --prefix plugin/gateway-core run build

      - name: Exercise V2 permission, tool-error and shell boundaries
        run: |
          python scripts/gateway_v2_permission_rejection_live_smoke.py
          python scripts/gateway_v2_tool_error_live_smoke.py
          python scripts/gateway_v2_shell_live_smoke.py
          python plugin/gateway-core/test/v2/execution_status_live_smoke.py

  windows-bounded-subprocess:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate bounded process-tree cleanup
        run: |
          python -m unittest tests.test_bounded_subprocess -v
